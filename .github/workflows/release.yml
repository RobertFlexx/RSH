name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Check the tag and project version
        id: version
        shell: bash
        run: |
          version="$(ruby -Ilib -rsrsh/version -e 'print Srsh::VERSION')"
          tag_version="${GITHUB_REF_NAME#v}"

          ruby -rrubygems -e 'Gem::Version.new(ARGV.fetch(0))' "$tag_version"

          if [ "$tag_version" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Srsh::VERSION $version" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run release checks
        run: make release-check

      - name: Build release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          gem build srsh.gemspec --output "dist/srsh-${VERSION}.gem"
          git archive --format=tar --prefix="srsh-${VERSION}/" "$GITHUB_SHA" | gzip -9 > "dist/srsh-${VERSION}.tar.gz"

          cp "dist/srsh-${VERSION}.gem" dist/srsh.gem
          cp "dist/srsh-${VERSION}.tar.gz" dist/srsh-source.tar.gz

          cd dist
          sha256sum \
            "srsh-${VERSION}.gem" \
            "srsh-${VERSION}.tar.gz" \
            srsh.gem \
            srsh-source.tar.gz > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "srsh ${VERSION}" \
              --generate-notes
          fi
