name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-4:
    name: Ruby 4 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Ruby 4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Show runtime version
        run: ruby --version

      - name: Run release checks
        run: make release-check
